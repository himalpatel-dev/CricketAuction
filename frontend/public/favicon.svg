<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BidWicket icon: ball hitting the wicket, on brand yellow -->
  <rect width="64" height="64" rx="14" fill="#ffb700"/>

  <!-- stumps -->
  <rect x="9" y="20" width="7" height="35" rx="2" fill="#111"/>
  <rect x="21" y="20" width="7" height="35" rx="2" fill="#111"/>
  <rect x="33" y="20" width="7" height="35" rx="2" fill="#111"/>

  <!-- bails: left one in place, right one knocked off -->
  <rect x="8" y="13.5" width="19" height="4.5" rx="2.25" fill="#111"/>
  <rect x="31" y="9" width="17" height="4.5" rx="2.25" fill="#111" transform="rotate(24 31 11.25)"/>

  <!-- ball -->
  <circle cx="47" cy="44" r="11" fill="#d62828" stroke="#ffb700" stroke-width="3"/>
  <path d="M40.5 37 Q47 44 53.5 51" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2.2 2.2"/>
</svg>
